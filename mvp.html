<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Machine — random SVG cats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--lilac:#E6E1F5;--ink:#241C3B;--paper:#FBF9F3;--grape:#6B5BD6;--mustard:#F2B233}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--lilac);color:var(--ink);font-family:Karla,system-ui,sans-serif;min-height:100vh;padding:26px 18px 60px}
  .wrap{max-width:1120px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(30px,6vw,52px);letter-spacing:-.03em;margin:0;line-height:.95}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
  .layout{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
  @media (max-width:820px){.layout{grid-template-columns:1fr}}
  .card{background:var(--paper);border:2px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 rgba(36,28,59,.9);padding:16px;margin-bottom:20px}
  .stage svg{width:100%;height:auto;display:block;border-radius:12px}
  .name{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em;margin:14px 0 2px}
  .seedline{font-family:'IBM Plex Mono',monospace;font-size:12px;opacity:.6}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
    border:1.5px solid var(--ink);border-radius:999px;padding:4px 10px;background:transparent;color:var(--ink);
    cursor:pointer;opacity:.62;width:auto;margin:0;box-shadow:none;transition:none}
  .chip:hover{opacity:1;box-shadow:none;transform:none}
  .chip.locked{background:var(--ink);color:var(--paper);opacity:1}
  h2{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 12px;opacity:.6;font-weight:600}
  h2:not(:first-child){margin-top:20px}
  button{font-family:Karla,sans-serif;font-weight:600;font-size:16px;width:100%;padding:12px;border-radius:12px;
    border:2px solid var(--ink);background:var(--mustard);color:var(--ink);cursor:pointer;margin-bottom:9px;
    transition:transform .08s ease,box-shadow .08s ease;box-shadow:3px 3px 0 var(--ink)}
  button.ghost{background:var(--paper)}
  button.sm{font-size:13px;padding:9px}
  button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  button:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .row2 button{margin-bottom:0}
  .seedrow{display:flex;gap:8px;margin-bottom:10px}
  input[type=text]{flex:1;min-width:0;font-family:'IBM Plex Mono',monospace;font-size:14px;padding:11px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
  input:focus-visible,select:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
  .tinker{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  label.f{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin-bottom:3px}
  select{width:100%;font-family:Karla,sans-serif;font-size:13px;padding:7px;border:2px solid var(--ink);border-radius:9px;background:#fff;color:var(--ink)}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .grid3 button,.favs button{padding:0;margin:0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:2px 2px 0 var(--ink)}
  .grid3 svg,.favs svg{display:block;width:100%;height:auto}
  .favs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;min-height:10px}
  .empty{font-size:13px;opacity:.5;grid-column:1/-1}
  .hint{font-size:12.5px;line-height:1.5;opacity:.6;margin:8px 0 0}
  .toggle{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:4px}
  .stats{font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.55;line-height:1.7;margin-top:14px}
  @media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cat Machine</h1>
    <span class="tag">flat geometric cats · pure SVG · <span id="combos"></span> combinations</span>
  </header>

  <div class="layout">
    <div>
      <div class="card stage">
        <div id="cat"></div>
        <div class="name" id="catName"></div>
        <div class="seedline" id="seedLabel"></div>
        <div class="chips" id="chips"></div>
        <p class="hint">Tap a trait to lock it — locked traits survive the next roll.</p>
      </div>
      <div class="card">
        <h2>The litter — tap to keep one</h2>
        <div class="grid3" id="litter"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Make a cat</h2>
        <button id="roll">New cat <span style="opacity:.5;font-size:13px">(space)</span></button>
        <div class="row2" style="margin-bottom:9px">
          <button class="ghost sm" id="save">Download SVG</button>
          <button class="ghost sm" id="png">Download PNG</button>
        </div>
        <div class="row2" style="margin-bottom:9px">
          <button class="ghost sm" id="copy">Copy SVG code</button>
          <button class="ghost sm" id="sheet">Export 3×3 sheet</button>
        </div>
        <button class="ghost sm" id="fav">Save to favourites</button>
        <div class="toggle"><input type="checkbox" id="anim" checked><label for="anim">Blink &amp; tail sway</label></div>
        <div class="toggle"><input type="checkbox" id="unlockAll" hidden></div>

        <h2>Style preset</h2>
        <select id="preset" style="margin-bottom:4px">
          <option value="anything">Anything goes</option>
          <option value="minimal">Minimal</option>
          <option value="maximal">Maximal</option>
          <option value="noir">Noir</option>
          <option value="pastel">Pastel</option>
          <option value="feral">Feral</option>
        </select>

        <h2>Type a seed</h2>
        <div class="seedrow">
          <input type="text" id="seedInput" placeholder="e.g. mackerel" aria-label="Seed word">
          <button class="ghost" id="go" style="width:auto;margin:0;padding:11px 16px">Go</button>
        </div>
        <p class="hint">Same seed, same cat — every time.</p>

        <h2>Tinker</h2>
        <div class="tinker" id="tinker"></div>
        <button class="ghost sm" id="clearLocks" style="margin-top:10px">Clear all locks</button>
        <div class="stats" id="stats"></div>
      </div>

      <div class="card">
        <h2>Favourites</h2>
        <div class="favs" id="favs"><span class="empty">Nothing saved yet.</span></div>
      </div>
    </div>
  </div>
</div>

<script>
/* CAT-CORE-START */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=hash(seed);return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const rr=(r,a,b)=>a+r()*(b-a);
const N=x=>Math.round(x*10)/10;
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(c1,c2,t)=>{const a=hx(c1),b=hx(c2);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('')};

/* ================= palettes ================= */
const PALETTES={
  bistro   :{bg:'#7B6BE8',a:'#3A2B27',b:'#F2B233',c:'#F7F2E6',d:'#E4572E'},
  sardine  :{bg:'#2E5E5B',a:'#1E1A26',b:'#7FD1C1',c:'#F6F1E4',d:'#EFA00B'},
  marmalade:{bg:'#F2C57C',a:'#C8532B',b:'#8C3B1E',c:'#FFF4E4',d:'#2B2038'},
  ash      :{bg:'#D6DBE3',a:'#4A4E58',b:'#98A0AC',c:'#FAFAF7',d:'#E1655A'},
  plum     :{bg:'#3B2A45',a:'#6B4E9B',b:'#D9A7C7',c:'#F6EAF1',d:'#F2B233'},
  moss     :{bg:'#C7D2AC',a:'#3E5233',b:'#8AA05A',c:'#F4F1E0',d:'#D96C3F'},
  sorbet   :{bg:'#F6D6E1',a:'#5B4B8A',b:'#EF6F6C',c:'#FFFDF7',d:'#F2B233'},
  ink      :{bg:'#EDE7DA',a:'#20202A',b:'#5B6BA8',c:'#FFFFFF',d:'#D8452F'},
  copper   :{bg:'#25333B',a:'#B4633A',b:'#E9A15B',c:'#F5E7D2',d:'#63C3B4'},
  seafoam  :{bg:'#BFE3DC',a:'#26545E',b:'#4E8E8A',c:'#FDFBF2',d:'#F06449'},
  cocoa    :{bg:'#E8D9C5',a:'#4A2F23',b:'#9C6B4A',c:'#FFF8EC',d:'#3F7D6E'},
  neon     :{bg:'#151223',a:'#2E2A48',b:'#C6F04E',c:'#F2F0FF',d:'#FF5CA8'},
  brick    :{bg:'#E6E0D2',a:'#A63A2B',b:'#D97A45',c:'#FFF6E9',d:'#31506B'},
  slate    :{bg:'#5A6B7C',a:'#22303D',b:'#8FA6B8',c:'#F1F3F2',d:'#F2B233'},
  lavender :{bg:'#CFC3F0',a:'#3E3466',b:'#8C7BD8',c:'#FBF7FF',d:'#FFC24B'},
  clay     :{bg:'#3D3B36',a:'#C97B4E',b:'#8A5A3B',c:'#F0E4D0',d:'#A8C15E'},
  storm    :{bg:'#1F2A38',a:'#3E5871',b:'#7E9DBD',c:'#E8EFF5',d:'#F2775A'},
  peach    :{bg:'#FFD9B8',a:'#8F4F3F',b:'#D98763',c:'#FFF7ED',d:'#4B7C8C'},
  jade     :{bg:'#0F3B33',a:'#1B6B57',b:'#4FA98C',c:'#EAF6EC',d:'#F5C542'},
  bubblegum:{bg:'#FF9EC4',a:'#7A2E5A',b:'#C4568F',c:'#FFF0F6',d:'#4ED6C8'},
  mustardy :{bg:'#E9B44C',a:'#3B3A36',b:'#7C7A6E',c:'#FBF6E7',d:'#C1462E'},
  sky      :{bg:'#A8D8F0',a:'#2C4E6B',b:'#5E8CB3',c:'#FBFDFF',d:'#F0A04B'},
  ember    :{bg:'#2B1B1B',a:'#7A2E1E',b:'#C4533A',c:'#F7E3D0',d:'#E9B44C'},
  glacier  :{bg:'#E4F0F4',a:'#5C7A8A',b:'#A9C6D2',c:'#FFFFFF',d:'#D96C6C'},
  aubergine:{bg:'#4A2545',a:'#8A4A7D',b:'#C98BBB',c:'#F8ECF5',d:'#8DD0A4'},
  wheat    :{bg:'#D9C9A3',a:'#6B5B3E',b:'#A08B5F',c:'#FBF6E4',d:'#B84A3E'},
  midnight :{bg:'#12162B',a:'#242C4E',b:'#4A5891',c:'#E6E9F7',d:'#F5D06B'},
  chartreuse:{bg:'#3A4A1E',a:'#8FA83B',b:'#C5D96B',c:'#F7FAE6',d:'#E0655B'},
  rosewood :{bg:'#F0DCD6',a:'#7A3B45',b:'#B5636F',c:'#FFF4F1',d:'#3E7A6B'},
  tangerine:{bg:'#FF9048',a:'#5A2E1B',b:'#A8542C',c:'#FFF1E2',d:'#2F6D8C'},
  arctic   :{bg:'#F2F6F8',a:'#3D4A56',b:'#8FA3B3',c:'#FFFFFF',d:'#5BBFB0'},
  velvet   :{bg:'#2A1230',a:'#5E2A5E',b:'#9C55A0',c:'#F5E6F7',d:'#F09A3E'},
  olive    :{bg:'#B7B58A',a:'#4B4A2C',b:'#7C7A4E',c:'#F7F5E2',d:'#C4553A'},
  cherry   :{bg:'#F5E1E1',a:'#9E2B3A',b:'#D0576A',c:'#FFF6F6',d:'#2F5D6B'}
};
/* ================= bodies ================= */
const BODIES={
  sit    :{d:'M150,238 C124,270 108,320 112,356 L288,356 C292,320 276,270 250,238 Z',hx:200,hy:168,hs:1,tx:288,ty:344},
  loaf   :{d:'M116,304 C116,264 150,246 200,246 C250,246 284,264 284,304 L284,356 L116,356 Z',hx:200,hy:196,hs:1,tx:284,ty:338},
  tall   :{d:'M160,228 C144,268 142,320 146,356 L254,356 C258,320 256,268 240,228 Z',hx:200,hy:158,hs:.96,tx:254,ty:346},
  perch  :{d:'M144,250 C126,286 118,326 122,356 L278,356 C282,318 268,282 252,250 Z',hx:200,hy:180,hs:1,tx:276,ty:344},
  stretch:{d:'M96,306 C96,272 132,254 200,254 C268,254 304,272 304,306 L304,356 L96,356 Z',hx:196,hy:208,hs:.98,tx:302,ty:330},
  curl   :{d:'M204,244 C270,244 314,288 314,320 C314,346 290,356 244,356 L118,356 C94,356 86,334 96,312 C110,280 152,244 204,244 Z',hx:158,hy:296,hs:.9,tx:302,ty:326},
  ready  :{d:'M138,262 C120,292 112,330 116,356 L284,356 C288,330 280,292 262,262 C240,240 160,240 138,262 Z',hx:200,hy:188,hs:1,tx:282,ty:342},
  sphinx :{d:'M92,322 C92,290 134,272 200,272 C266,272 308,290 308,322 L308,356 L92,356 Z',hx:200,hy:226,hs:.95,tx:306,ty:334},
  chonk  :{d:'M200,232 C268,232 302,280 302,318 C302,346 262,356 200,356 C138,356 98,346 98,318 C98,280 132,232 200,232 Z',hx:200,hy:176,hs:.94,tx:300,ty:330},
  kitten :{d:'M170,286 C154,306 148,334 152,356 L248,356 C252,334 246,306 230,286 Z',hx:200,hy:216,hs:1.14,tx:248,ty:348},
  leap   :{d:'M152,300 C142,262 172,232 214,238 C256,244 272,286 264,320 L258,356 L148,356 Z',hx:206,hy:180,hs:.95,tx:262,ty:330},
  slink  :{d:'M84,340 C84,318 116,306 200,306 C284,306 316,318 316,340 L316,356 L84,356 Z',hx:196,hy:262,hs:.86,tx:314,ty:340},
  beg    :{d:'M168,232 C150,268 142,322 148,356 L252,356 C258,322 250,268 232,232 C220,218 180,218 168,232 Z',hx:200,hy:162,hs:.98,tx:250,ty:348},
  bread  :{d:'M108,356 C108,296 148,264 200,264 C252,264 292,296 292,356 Z',hx:200,hy:206,hs:1.02,tx:290,ty:342}
};
/* ================= tails ================= */
const TAILS={
  curl  :(x,y)=>`M${x},${y} C${x+58},${y+2} ${x+72},${y-42} ${x+42},${y-70}`,
  up    :(x,y)=>`M${x},${y} C${x+50},${y+4} ${x+70},${y-46} ${x+62},${y-100}`,
  sweep :(x,y)=>`M${x},${y} C${x+58},${y+8} ${x+84},${y-16} ${x+72},${y-48}`,
  hook  :(x,y)=>`M${x},${y} C${x+54},${y-6} ${x+64},${y-50} ${x+30},${y-60}`,
  kink  :(x,y)=>`M${x},${y} C${x+44},${y+2} ${x+50},${y-28} ${x+30},${y-38} L${x+56},${y-62}`,
  wrap  :(x,y)=>`M${x},${y} C${x+34},${y+16} ${x-60},${y+30} ${x-140},${y+16}`,
  puff  :(x,y)=>`M${x},${y} C${x+30},${y-2} ${x+42},${y-22} ${x+34},${y-38}`,
  scurve:(x,y)=>`M${x},${y} C${x+62},${y+6} ${x+30},${y-40} ${x+76},${y-70}`,
  bolt  :(x,y)=>`M${x},${y} L${x+40},${y-14} L${x+20},${y-40} L${x+58},${y-58}`,
  spiral:(x,y)=>`M${x},${y} C${x+56},${y+4} ${x+70},${y-34} ${x+44},${y-46} C${x+26},${y-54} ${x+26},${y-30} ${x+44},${y-26}`,
  droop :(x,y)=>`M${x},${y} C${x+52},${y+12} ${x+74},${y+6} ${x+84},${y-14}`,
  stub  :(x,y)=>`M${x},${y-4} C${x+18},${y-8} ${x+26},${y-18} ${x+24},${y-28}`,
  question:(x,y)=>`M${x},${y} C${x+56},${y+2} ${x+64},${y-56} ${x+36},${y-70} C${x+18},${y-78} ${x+10},${y-64} ${x+18},${y-56}`,
  plume :(x,y)=>`M${x},${y} C${x+52},${y-4} ${x+58},${y-48} ${x+28},${y-76}`,
  low   :(x,y)=>`M${x},${y+4} C${x+48},${y+16} ${x+80},${y+10} ${x+92},${y-6}`
};
const TAIL_W={curl:24,up:24,sweep:24,hook:22,kink:20,wrap:22,puff:36,scurve:18,bolt:16,spiral:18,droop:22,stub:30,question:20,plume:34,low:20};
const TAILTIPS=['none','tipped','ringed','poof','dipped'];
function tailLayer(t,C){
  const b=BODIES[t.body],d=TAILS[t.tail](b.tx,b.ty),w=TAIL_W[t.tail];
  let s=`<path d="${d}" fill="none" stroke="${C.tail}" stroke-width="${w}" stroke-linecap="round"/>`;
  const k=t.tailtip;
  if(k==='tipped') s+=`<path d="${d}" pathLength="100" fill="none" stroke="${C.cream}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="16 100" stroke-dashoffset="-84"/>`;
  if(k==='dipped') s+=`<path d="${d}" pathLength="100" fill="none" stroke="${C.mark}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="30 100" stroke-dashoffset="-70"/>`;
  if(k==='ringed') s+=`<path d="${d}" pathLength="100" fill="none" stroke="${C.mark}" stroke-width="${w}" stroke-dasharray="7 9"/>`;
  if(k==='poof')   s+=`<path d="${d}" pathLength="100" fill="none" stroke="${C.tail}" stroke-width="${w+18}" stroke-linecap="round" stroke-dasharray="9 100" stroke-dashoffset="-91"/>`;
  return s;
}
/* ================= heads ================= */
const EARS=['pointy','tall','round','wide','tufted','folded','notched','satellite','curled'];
const HEADS={standard:[1,1],wide:[1.14,.92],narrow:[.88,1.06],long:[1,1.14],squat:[1.08,.86]};
function headPath(cx,cy,ears){
  const hw=76,hh=52;
  if(ears==='round'||ears==='folded'||ears==='curled'){
    const eh=ears==='folded'?14:ears==='curled'?22:30;
    return `M${cx-hw},${cy+6} C${cx-hw-2},${cy-hh} ${cx-hw+6},${cy-hh-eh} ${cx-hw+34},${cy-hh-eh+6}
      C${cx-30},${cy-hh-16} ${cx+30},${cy-hh-16} ${cx+hw-34},${cy-hh-eh+6}
      C${cx+hw-6},${cy-hh-eh} ${cx+hw+2},${cy-hh} ${cx+hw},${cy+6}
      C${cx+hw},${cy+hh} ${cx+40},${cy+hh+12} ${cx},${cy+hh+12}
      C${cx-40},${cy+hh+12} ${cx-hw},${cy+hh} ${cx-hw},${cy+6} Z`;
  }
  if(ears==='notched') return `M${cx-hw},${cy+4} L${cx-hw+2},${cy-hh+6} L${cx-hw+8},${cy-hh-40} L${cx-52},${cy-hh-18} L${cx-40},${cy-hh-34} L${cx-26},${cy-hh-2}
      L${cx+26},${cy-hh-2} L${cx+40},${cy-hh-34} L${cx+52},${cy-hh-18} L${cx+hw-8},${cy-hh-40} L${cx+hw-2},${cy-hh+6} L${cx+hw},${cy+4}
      C${cx+hw},${cy+hh} ${cx+42},${cy+hh+12} ${cx},${cy+hh+12} C${cx-42},${cy+hh+12} ${cx-hw},${cy+hh} ${cx-hw},${cy+4} Z`;
  if(ears==='satellite') return `M${cx-hw},${cy+4} L${cx-hw-16},${cy-hh-6} L${cx-hw-6},${cy-hh-40} L${cx-24},${cy-hh-4}
      L${cx+24},${cy-hh-4} L${cx+hw+6},${cy-hh-40} L${cx+hw+16},${cy-hh-6} L${cx+hw},${cy+4}
      C${cx+hw},${cy+hh} ${cx+42},${cy+hh+12} ${cx},${cy+hh+12} C${cx-42},${cy+hh+12} ${cx-hw},${cy+hh} ${cx-hw},${cy+4} Z`;
  const eh=ears==='tall'?60:ears==='wide'?34:44;
  const lean=ears==='tall'?12:ears==='wide'?-8:4;
  const inner=ears==='wide'?38:28;
  return `M${cx-hw},${cy+4} L${cx-hw+2},${cy-hh+6} L${cx-hw+lean+6},${cy-hh-eh} L${cx-inner},${cy-hh-2}
    L${cx+inner},${cy-hh-2} L${cx+hw-lean-6},${cy-hh-eh} L${cx+hw-2},${cy-hh+6} L${cx+hw},${cy+4}
    C${cx+hw},${cy+hh} ${cx+42},${cy+hh+12} ${cx},${cy+hh+12}

  palette:Object.keys(PALETTES), tone:TONES, body:BODIES&&Object.keys(BODIES), size:Object.keys(SIZES), posture:Object.keys(POSTURES),
  coat:COATS, fluff:FLUFF, face:FACES, head:Object.keys(HEADS), ears:EARS, eyes:EYES, lashes:LASHES,
  nose:NOSES, mouth:MOUTHS, whiskers:WHISKERS, tail:Object.keys(TAILS), tailtip:TAILTIPS, paws:PAWS,
  extra:EXTRAS, hold:HOLDS, prop:PROPS, aura:AURAS, scene:SCENES, tint:TINTS, frame:FRAMES
};
const COMBOS=Object.values(SPEC).reduce((n,v)=>n*new Set(v).size,1);
const PRESETS={
  anything:{},
  minimal:{coat:['solid','bib','socks','belly'],face:['plain','split','blaze'],extra:['none'],prop:['none'],aura:['none'],
    scene:['flat','halo','arch','horizon'],frame:['none','rule'],fluff:['smooth'],hold:['none'],tint:['none'],tailtip:['none']},
  maximal:{extra:EXTRAS.filter(v=>v!=='none'),prop:PROPS.filter(v=>v!=='none'),aura:AURAS.filter(v=>v!=='none'),
    hold:HOLDS.filter(v=>v!=='none'),scene:['confetti','rays','rings','night','stripe','tiles','spotlight'],frame:['badge','dashed','double','corners']},
  noir:{palette:['ink','midnight','storm','slate','ash','arctic','glacier'],tone:['mono','smoke','standard'],tint:['cool','dusk','none'],
    scene:['flat','spotlight','window','grid','night'],extra:['none','shades','tie','monocle','bowtie'],aura:['none','question','music']},
  pastel:{palette:['sorbet','lavender','sky','rosewood','peach','bubblegum','seafoam','glacier','cherry'],tone:['standard','frost','points'],
    tint:['none','faded','warm'],aura:['none','hearts','sparkle','bubbles'],scene:['halo','dots','arch','rings','waves','hills']},
  feral:{body:['ready','leap','slink','stretch','tall'],coat:['stripes','rosettes','tortie','spots','vstripes','chevron'],
    eyes:['slit','glow','wedge','squint'],mouth:['fang','grin','open'],extra:['none'],aura:['none','anger'],fluff:['spiky','tufty','longhair']}
};
function makeTraits(seed,locks,preset){
  const r=rng(seed), t={seed}, pre=PRESETS[preset||'anything']||{};
  for(const k of Object.keys(SPEC)) t[k]=pick(r,pre[k]&&pre[k].length?pre[k]:SPEC[k]);
  t.tilt=N(rr(r,-26,26));
  t.propSide=r()<.5;
  Object.assign(t,locks||{});
  const b=BODIES[t.body];
  if(b.hy>240 && NECK.includes(t.extra) && !(locks&&locks.extra)) t.extra='none';
  if(b.hy>240 && !(locks&&locks.hold)) t.hold='none';
  return t;
}
/* ================= render ================= */
function renderCat(t,size,animate){
  const p=PALETTES[t.palette], body=BODIES[t.body], C=toneOf(t.tone,p);
  const r=rng(t.seed+'|art');
  const cx=body.hx, cy=body.hy, hs=body.hs;
  const [sx,sy]=HEADS[t.head];
  const hp=headPath(cx,cy,t.ears);
  const u='c'+hash(t.seed+t.body+t.ears+t.coat+t.head).toString(36);
  const ink=mix(C.head,'#000000',.55);
  const sc=SIZES[t.size], rot=POSTURES[t.posture];
  const anim=animate?`<style>
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
    @keyframes sway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-7deg)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .eyes{animation:blink 5.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .tail{animation:sway 3.6s ease-in-out infinite;transform-origin:${body.tx}px ${body.ty}px}
    .aura{animation:bob 3s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.eyes,.tail,.aura{animation:none}}
  </style>`:'';

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="${size}" height="${size}" role="img" aria-label="A geometric cat">
${anim}<defs>
<clipPath id="b${u}"><path d="${body.d}"/></clipPath>
<clipPath id="h${u}"><path d="${hp}"/></clipPath>
<clipPath id="f${u}"><rect width="400" height="400" rx="14"/></clipPath>
</defs>
<g clip-path="url(#f${u})">
${sceneG(t.scene,p,r,C)}
<g transform="translate(200,368) scale(${sc}) rotate(${rot}) translate(-200,-368)">
<ellipse cx="200" cy="360" rx="128" ry="16" fill="${p.a}" opacity=".18"/>
<g class="tail">${tailLayer(t,C)}</g>
${fluffG(t.fluff,body,C)}
<path d="${body.d}" fill="${C.body}"/>
<g clip-path="url(#b${u})">${coatG(t.coat,C,r)}</g>
${holdG(t.hold,C,p)}
${pawsG(t.paws,C)}
${propG(t.prop,C,p,t.propSide)}
<g transform="translate(${cx},${cy}) scale(${N(hs*sx)},${N(hs*sy)}) translate(${-cx},${-cy})">
  <path d="${hp}" fill="${C.head}"/>
  <g clip-path="url(#h${u})">${faceG(t.face,cx,cy,C,t.tilt)}</g>
  ${earExtras(cx,cy,t.ears,C)}
  ${whiskersG(t.whiskers,cx,cy+32,C.cream)}
  <g class="eyes">${eyesG(t.eyes,cx,cy,ink,C.cream,C.pop)}</g>
  ${lashesG(t.lashes,cx,cy,ink)}
  ${noseG(t.nose,cx,cy+22,C.pop)}
  ${mouthG(t.mouth,cx,cy+22,ink,C.pop,C.cream)}
  ${extraG(t.extra,cx,cy,C,p)}
</g>
<g class="aura">${auraG(t.aura,cx,cy,C,p)}</g>
</g>
${tintG(t.tint)}
${frameG(t.frame,p,C)}
</g>
</svg>`;
}
/* ================= names ================= */
const FIRST=['Biscuit','Mackerel','Pickle','Domino','Waffle','Juniper','Turnip','Saffron','Noodle','Pebble','Anchovy','Clementine','Marzipan','Ottoman','Buckle','Sprocket','Vermouth','Tangerine','Barnaby','Olive','Kimchi','Pretzel','Marlowe','Truffle','Gusto','Parsnip','Halibut','Wednesday','Custard','Bergamot'];
const LAST=['the Brief','of the Sofa','Esq.','the Third','the Loud','Junior','the Patient','the Unbothered','the Damp','the Magnificent','the Small','the Vast','the Reasonable','of No Fixed Abode','the Nocturnal'];
function catName(seed){const r=rng(seed+'|name');return pick(r,FIRST)+' '+pick(r,LAST)}
const LABEL={body:t=>t.body,head:t=>t.head+' head',ears:t=>t.ears+' ears',eyes:t=>t.eyes+' eyes',lashes:t=>t.lashes==='none'?'no lashes':t.lashes+' lashes',
  nose:t=>t.nose+' nose',mouth:t=>t.mouth==='none'?'no mouth':t.mouth+' mouth',whiskers:t=>t.whiskers==='none'?'no whiskers':t.whiskers+' whiskers',
  coat:t=>t.coat==='solid'?'solid coat':t.coat,fluff:t=>t.fluff+' fur',face:t=>t.face==='plain'?'clean face':t.face,
  tail:t=>t.tail+' tail',tailtip:t=>t.tailtip==='none'?'plain tip':t.tailtip+' tip',paws:t=>t.paws==='none'?'no paws':t.paws+' paws',
  extra:t=>t.extra==='none'?'no accessory':t.extra,hold:t=>t.hold==='none'?'empty paws':'holding '+t.hold,
  prop:t=>t.prop==='none'?'no prop':t.prop,aura:t=>t.aura==='none'?'no aura':t.aura,scene:t=>t.scene,
  tint:t=>t.tint==='none'?'no tint':t.tint+' tint',frame:t=>t.frame==='none'?'no frame':t.frame+' frame',
  palette:t=>t.palette,tone:t=>t.tone+' tone',size:t=>t.size,posture:t=>t.posture};
/* CAT-CORE-END */

/* ================= app ================= */
const words=['mackerel','biscuit','tuna','pebble','marzipan','ottoman','sardine','pickle','domino','clementine','pudding','waffle','juniper','moth','pistachio','buckle','anchovy','turnip','saffron','noodle'];
const newSeed=()=>words[Math.floor(Math.random()*words.length)]+'-'+Math.floor(Math.random()*9000+1000);
let locks={}, T=null, favs=[];
const $=id=>document.getElementById(id);
const animOn=()=>$('anim').checked;
const preset=()=>$('preset').value;

function paint(){
  $('cat').innerHTML=renderCat(T,400,animOn());
  $('catName').textContent=catName(T.seed);
  $('seedLabel').textContent='seed · '+T.seed;
  $('chips').innerHTML=Object.keys(LABEL).map(k=>
    `<button class="chip${locks[k]?' locked':''}" data-k="${k}" aria-pressed="${!!locks[k]}">${locks[k]?'🔒 ':''}${LABEL[k](T)}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const k=c.dataset.k;
    if(locks[k]) delete locks[k]; else locks[k]=T[k];
    paint(); syncTinker();
  });
}
function roll(seed){ T=makeTraits(seed||newSeed(),locks,preset()); paint(); syncTinker(); }

function buildTinker(){
  $('tinker').innerHTML=Object.keys(SPEC).map(k=>
    `<div><label class="f" for="s_${k}">${k}</label><select id="s_${k}" data-k="${k}">`+
    [...new Set(SPEC[k])].map(v=>`<option value="${v}">${v}</option>`).join('')+`</select></div>`).join('');
  $('tinker').querySelectorAll('select').forEach(sel=>sel.onchange=()=>{
    const k=sel.dataset.k; locks[k]=sel.value; T[k]=sel.value; paint();
  });
}
function syncTinker(){ Object.keys(SPEC).forEach(k=>{const sel=$('s_'+k); if(sel) sel.value=T[k]}) }

function litter(){
  const box=$('litter'); box.innerHTML='';
  for(let i=0;i<9;i++){
    const t=makeTraits(newSeed(),locks,preset()), b=document.createElement('button');
    b.innerHTML=renderCat(t,120,false);
    b.setAttribute('aria-label','Keep this cat');
    b.onclick=()=>{T=t;paint();syncTinker()};
    box.appendChild(b);
  }
}
function drawFavs(){
  const box=$('favs');
  if(!favs.length){box.innerHTML='<span class="empty">Nothing saved yet.</span>';return}
  box.innerHTML='';
  favs.forEach(t=>{const b=document.createElement('button');b.innerHTML=renderCat(t,90,false);
    b.setAttribute('aria-label','Load '+catName(t.seed));b.onclick=()=>{T={...t};paint();syncTinker()};box.appendChild(b)});
}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}

$('roll').onclick=()=>{roll();litter()};
$('go').onclick=()=>{const v=$('seedInput').value.trim();if(v){roll(v);$('seedInput').value=''}};
$('seedInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
$('anim').onchange=paint;
$('preset').onchange=()=>{roll();litter()};
$('clearLocks').onclick=()=>{locks={};paint()};
$('fav').onclick=()=>{favs.unshift({...T});favs=favs.slice(0,12);drawFavs()};
$('save').onclick=()=>download('cat-'+T.seed+'.svg',new Blob([renderCat(T,400,animOn())],{type:'image/svg+xml'}));
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(renderCat(T,400,animOn()));
  $('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy SVG code',1200)}catch(e){$('copy').textContent='Copy blocked'}};
$('png').onclick=()=>{
  const svg=renderCat(T,800,false), img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=800;
    c.getContext('2d').drawImage(img,0,0,800,800);
    c.toBlob(b=>download('cat-'+T.seed+'.png',b))};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
};
$('sheet').onclick=()=>{
  const cells=[];for(let i=0;i<9;i++)cells.push(makeTraits(newSeed(),locks,preset()));
  const inner=cells.map((t,i)=>{
    const body=renderCat(t,400,false).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
    return `<g transform="translate(${(i%3)*400},${Math.floor(i/3)*400})">${body}</g>`}).join('');
  download('cat-sheet.svg',new Blob([`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">${inner}</svg>`],{type:'image/svg+xml'}));
};
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();roll();litter()}
});
$('combos').textContent=COMBOS.toLocaleString('en-US',{notation:'compact',maximumFractionDigits:1});
$('stats').innerHTML=Object.keys(SPEC).map(k=>`${new Set(SPEC[k]).size} ${k}`).join(' · ');
buildTinker();roll();litter();drawFavs();
</script>
</body>
</html>
